global:
  scrape_interval: 15s

scrape_configs:
  # Métricas de la propia API (inventario-hogar)
  - job_name: "inventario-api"
    static_configs:
      - targets: ["api:8000"]

  # Métricas del servidor (CPU, RAM, disco)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Métricas de contenedores Docker
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]