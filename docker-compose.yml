services:
  db:
    image: postgres:16
    container_name: inventario-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventario_user
      POSTGRES_PASSWORD: inventario_pass
      POSTGRES_DB: inventario_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    container_name: inventario-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://inventario_user:inventario_pass@db:5432/inventario_db
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
volumes:
  pgdata:
  prometheus_data:
  grafana_data:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"


#--build: . → en vez de usar una imagen ya publicada (como postgres:16), 
#le dice a Docker que construya la imagen usando el Dockerfile de la carpeta actual.
#--depends_on: - db → asegura que Docker intente levantar db antes que api 
#(ojo: esto solo controla el orden de arranque, no espera a que Postgres esté 
#cien% listo para aceptar conexiones — a veces hace falta un mecanismo de "retry" en la app, 
#pero para empezar está bien).
#--DATABASE_URL: postgresql://...@db:5432/... → aquí sí usamos db como host (no localhost), 
#porque ahora la API vive dentro de la misma red de Docker que la base de datos, 
#y puede resolver db como nombre del servicio.
#--SECRET_KEY: ${SECRET_KEY} → esto lee la variable desde archivo .env 
#automáticamente (Docker Compose lee .env de la raíz del proyecto por defecto).

#--Prometheus → cada 15 segundos, "scrapea" (consulta) los endpoints /metrics
# de la API, node-exporter y cAdvisor, y guarda el historial
#--Grafana → se conecta a Prometheus como fuente de datos y arma dashboards visuales
#--node-exporter → expone métricas del sistema operativo del servidor (CPU, RAM, disco, red)
#--cAdvisor → expone métricas específicas de cada contenedor Docker corriendo 
#(cuánta RAM/CPU usa cada uno)